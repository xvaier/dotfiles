set -g default-terminal "tmux-256color"

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys:hyperlinks:margins:mouse:osc7:overline:rectfill:strikethrough:sync:usstyle'
set -g set-clipboard on
set -g bell-action any

# Don't auto rename windows
set -g renumber-windows on

run-shell -b "~/.dotfiles/tmux/claude-agent-status.sh daemon"

# Rebind prefix
set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

# More intuitive split controls
unbind %
bind '|' split-window -h 
unbind '"'
bind - split-window -v

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

unbind [
bind v copy-mode 

# Bind r to reload tmux config
unbind r
bind r source-file ~/.tmux.conf

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# Status bar customization
set-option -g status-position top
set -g status-style fg=default,bg=default
set -g status-right-length 100
set -g status-right " #{@claude_status_all}  #{client_user}#[bold]@#h#[nobold] "
set -g status-left " #[bold]#S#[nobold] "

# Session picker: tmux's default choose-tree format, with each session's own
# Claude counts appended. @claude_status is kept up to date by the daemon.
set -g @choose_tree_format "#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: \"#{pane_title}\",},window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: \"#{pane_title}\",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}#{?@claude_status,  #{@claude_status},}}"
bind s choose-tree -Zs -F "#{E:@choose_tree_format}"
bind w choose-tree -Zw -F "#{E:@choose_tree_format}"
bind S display-popup -E -w 60% -h 60% "~/.dotfiles/tmux/tmux-session-manager.sh"
set -g status-left-length 20
set -g status-justify centre
set -g set-titles-string 'allo #{pane_title}'

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# catpuccing theme for tmux
set -g @catppuccin_flavor 'mocha'
run ~/.dotfiles/tmux/catpuccin/catppuccin.tmux
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @resurrect-capture-pane-contents 'on'


# tmux 3.7b: an explicitly-set message-style (any value, even its own default)
# stops the command prompt from clearing the status line, so the window list
# stays visible behind it. Catppuccin sets it, so unset it after the theme loads.
set -gu message-style
set -gu message-command-style

# The default message-style fills the prompt yellow, so darken the cursor.
set -g prompt-cursor-colour '#11111b'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
