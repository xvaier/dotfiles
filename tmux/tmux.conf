set -g default-terminal "tmux-256color"

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys:hyperlinks:margins:mouse:osc7:overline:rectfill:strikethrough:sync:usstyle'

# zsh-vi-mode emits \e[0 q ("terminal default") before every command; without
# this it resolves to ghostty's block. Normal mode still sends an explicit block.
set -g cursor-style bar
# Copy mode is vi normal mode, so it wants a block rather than the bar default.
set-hook -g pane-mode-changed 'if -F "#{pane_in_mode}" "set -p cursor-style block" "set -pu cursor-style"'

set -g set-clipboard on
set -g bell-action any

set -g renumber-windows on

# Name windows after the git branch, falling back to the worktree name and
# then the cwd basename. Re-runs on status-interval, so branch switches show up.
setw -g automatic-rename-format "#(~/.dotfiles/tmux/window-name.sh '#{pane_current_path}')"

run-shell -b "~/.dotfiles/tmux/claude-agent-status.sh daemon"

set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

unbind %
bind '|' split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

unbind [
bind v copy-mode 

unbind r
bind r source-file ~/.tmux.conf

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

set-option -g status-position top
set -g status-style fg=default,bg=default
set -g status-right-length 100
set -g status-right " #{@claude_status_all}  #{client_user}#[bold]@#h#[nobold] "
set -g status-left " #[bold]#S#[nobold] "

# tmux's default choose-tree format with each session's Claude counts appended.
set -g @choose_tree_format "#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: \"#{pane_title}\",},window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: \"#{pane_title}\",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}#{?@claude_status,  #{@claude_status},}}"
bind s choose-tree -Zs -F "#{E:@choose_tree_format}"
bind w choose-tree -Zw -F "#{E:@choose_tree_format}"
bind S display-popup -E -w 60% -h 60% "~/.dotfiles/tmux/tmux-session-manager.sh"
set -g status-left-length 20
set -g status-justify centre

# Keeps ESC snappy in Neovim.
set -sg escape-time 10

# Catppuccin options must be set before tpm loads the plugin below.
set -g @catppuccin_flavor 'mocha'
# @claude_status_window is a per-window option the daemon keeps up to date.
# push-default makes the counts' #[fg=default] fall back to catppuccin's window
# style instead of the status bar default.
set -g @catppuccin_window_text " #W#{?@claude_status_window, #[push-default]#{@claude_status_window}#[pop-default],}"
set -g @catppuccin_window_current_text " #W#{?@claude_status_window, #[push-default]#{@claude_status_window}#[pop-default],}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager. Must come after every @plugin line above.
run '~/.tmux/plugins/tpm/tpm'

# tmux 3.7b: an explicitly-set message-style (any value, even its own default)
# stops the command prompt from clearing the status line, so the window list
# stays visible behind it. Catppuccin sets it, so unset it after the theme loads.
set -gu message-style
set -gu message-command-style

# The default message-style fills the prompt yellow, so darken the cursor.
set -g prompt-cursor-colour '#11111b'
