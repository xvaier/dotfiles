set -g default-terminal "tmux-256color"

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features ',xterm-ghostty:extkeys:hyperlinks:margins:mouse:osc7:overline:rectfill:strikethrough:sync:usstyle'

set -g cursor-style bar
set-hook -g pane-mode-changed 'if -F "#{pane_in_mode}" "set -p cursor-style block" "set -pu cursor-style"'

set -g set-clipboard on
set -g bell-action any

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5      # window-name.sh re-runs on this cadence
set -g focus-events on        # nvim autoread
setw -g aggressive-resize on

set -g renumber-windows on
set -g detach-on-destroy off

setw -g automatic-rename-format "#(~/.dotfiles/tmux/window-name.sh '#{pane_current_path}')"

run-shell -b "~/.dotfiles/tmux/claude-agent-status.sh daemon"

set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

unbind %
bind '|' split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

unbind [
bind v copy-mode

unbind r
bind r source-file ~/.tmux.conf

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

set-option -g status-position top
set -g status-style fg=default,bg=default
set -g status-justify centre
set -g status-right-length 100
set -g status-right " #{@claude_status_all}  #{client_user}#[bold]@#h#[nobold] "
set -g status-left-length 20
set -g status-left " #[bold]#S#[nobold] "

# Catppuccin-mocha window tabs
set -g window-status-format "#[fg=#11111b,bg=#9399b2] #I #[fg=#cdd6f4,bg=#313244] #W#{?@claude_status_window, #[push-default]#{@claude_status_window}#[pop-default],} "
set -g window-status-current-format "#[fg=#11111b,bg=#cba6f7] #I #[fg=#cdd6f4,bg=#45475a] #W#{?@claude_status_window, #[push-default]#{@claude_status_window}#[pop-default],} "
set -g window-status-separator " "

# Catpuccin-mocha window picker
set -g @choose_tree_format "#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: \"#{pane_title}\",},window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: \"#{pane_title}\",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}#{?@claude_status,  #{@claude_status},}}"
bind s choose-tree -Zs -F "#{E:@choose_tree_format}"
bind w choose-tree -Zw -F "#{E:@choose_tree_format}"
bind S display-popup -E -w 60% -h 60% "~/.dotfiles/tmux/tmux-session-manager.sh"

# Keeps ESC snappy in Neovim.
set -sg escape-time 10
set -g prompt-cursor-colour '#11111b'

# nvim <> tmux C- navigation
set -g @is_vim "#{m/ri:^g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}"
bind-key -n C-h if-shell -F "#{E:@is_vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell -F "#{E:@is_vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell -F "#{E:@is_vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell -F "#{E:@is_vim}" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
