name: Publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked private files and machine paths
        run: python3 scripts/check-publication.py
      - name: Scan history for credentials
        # Betterleaks v1.10.0, pinned by digest; read-only checkout and no live credential validation.
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/betterleaks/betterleaks@sha256:c6dfa75145fe5b31fdaf02feff18a73f1e11df8ca04876522f87f857656c83ca \
            git /repo --log-opts='--all --full-history --diff-merges=first-parent' \
            --validation=false --redact=100 --no-banner --no-color
