name: Publication checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked private files and machine paths
        run: python3 scripts/check-publication.py
      - name: Scan history for credentials
        # Fixed scanner version; read-only checkout, no repository secrets.
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 git /repo --redact --no-banner
